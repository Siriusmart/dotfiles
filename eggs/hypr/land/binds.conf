$mainMod = SUPER

bind = $mainMod, X, killactive

# Launch apps
bind = $mainMod, U, exec, thunar
bind = $mainMod, T, exec, kitty --single-instance
bind = $mainMod, F, exec, firefox
bind = $mainMod, L, exec, bash ~/.config/wlogout/logout.sh
bind = $mainMod, Space, exec, bash ~/.config/hypr/land/scripts/rofishow.sh drun
bind = $mainMod, Tab, exec, bash ~/.config/hypr/land/scripts/rofishow.sh window
bind = $mainMod, C, exec, bash ~/.config/hypr/land/scripts/rofishow.sh calc
bind = $mainMod, R, exec, bash ~/.config/hypr/land/scripts/rofishow.sh recursivebrowser
bind = $mainMod, S, exec, bash ~/.config/hypr/land/scripts/rofishow.sh filebrowser
bind = $mainMod, M, exec, bash ~/.config/hypr/land/scripts/wlogout.sh
bind = $mainMod, H, exec, [float; size 40% 50%] kitty -e bash ~/.config/hypr/land/scripts/notetaker.sh
bind = $mainMod, G, exec, [float; size 40% 50%] kitty -e bash ~/.config/hypr/land/scripts/todo.sh
bind = , Print, exec, bash ~/.config/hypr/land/scripts/printscr.sh monitor nosave
bind = Shift, Print, exec, bash ~/.config/hypr/land/scripts/printscr.sh monitor save
bind = Ctrl, Print, exec, bash ~/.config/hypr/land/scripts/printscr.sh region nosave
bind = Ctrl_Shift, Print, exec, bash ~/.config/hypr/land/scripts/printscr.sh region save
bind = $mainMod_ALT, V, exec, rofi -modi clipboard:~/.config/rofi/scripts/cliphist-rofi-img -show clipboard -show-icons

binde = , code:232, exec, brightnessctl -q -n s 5%- && bash ~/.config/hypr/land/scripts/show-brightness.sh # F2
binde = , code:233, exec, brightnessctl -q -n s +5% && bash ~/.config/hypr/land/scripts/show-brightness.sh # F3
bind = , code:121, exec,  bash ~/.config/hypr/land/scripts/volume-mute.sh # F5
binde = , code:122, exec, bash ~/.config/hypr/land/scripts/volume-decrease.sh # F6
binde = , code:123, exec, bash ~/.config/hypr/land/scripts/volume-increase.sh # F7
bind = , code:256, exec, bash ~/.config/hypr/land/scripts/mic-mute.sh  # F8
bind = , code:173, exec, playerctl position 5-      # F9
bind = , code:172, exec, playerctl play-pause       # F10
bind = , code:171, exec, playerctl position 5+      # F11

# Move focus
bind = $mainMod, n, movefocus, l
bind = $mainMod, o, movefocus, r
bind = $mainMod, i, movefocus, u
bind = $mainMod, e, movefocus, d
bind = $mainMod, k, cyclenext,
bind = $mainMod, k, alterzorder, top
bind = $mainMod Shift, k, cyclenext, prev
bind = $mainMod Shift, k, alterzorder, top

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, KP_END, workspace, 1
bind = $mainMod, KP_DOWN, workspace, 2
bind = $mainMod, KP_NEXT, workspace, 3
bind = $mainMod, KP_LEFT, workspace, 4
bind = $mainMod, KP_BEGIN, workspace, 5
bind = $mainMod, KP_RIGHT, workspace, 6
bind = $mainMod, KP_HOME, workspace, 7
bind = $mainMod, KP_UP, workspace, 8
bind = $mainMod, KP_PRIOR, workspace, 9
bind = $mainMod, KP_INSERT, workspace, 10
bind = $mainMod_Shift, I, workspace, -1
bind = $mainMod_Shift, E, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod ALT, KP_END, movetoworkspace, 1
bind = $mainMod ALT, KP_DOWN, movetoworkspace, 2
bind = $mainMod ALT, KP_NEXT, movetoworkspace, 3
bind = $mainMod ALT, KP_LEFT, movetoworkspace, 4
bind = $mainMod ALT, KP_BEGIN, movetoworkspace, 5
bind = $mainMod ALT, KP_RIGHT, movetoworkspace, 6
bind = $mainMod ALT, KP_HOME, movetoworkspace, 7
bind = $mainMod ALT, KP_UP, movetoworkspace, 8
bind = $mainMod ALT, KP_PRIOR, movetoworkspace, 9
bind = $mainMod ALT, KP_INSERT, movetoworkspace, 10
bind = $mainMod ALT, E, exec, ~/.config/hypr/land/scripts/movetonextworkspace.sh
bind = $mainMod ALT, I, exec, bash ~/.config/hypr/land/scripts/movetopreviousworkspace.sh

# Swap window position
bind = $mainMod CTRL, i, exec, bash ~/.config/hypr/land/scripts/movewindow.sh u
bind = $mainMod CTRL, e, exec, bash ~/.config/hypr/land/scripts/movewindow.sh d
bind = $mainMod CTRL, n, exec, bash ~/.config/hypr/land/scripts/movewindow.sh l
bind = $mainMod CTRL, o, exec, bash ~/.config/hypr/land/scripts/movewindow.sh r

# Resize window
binde = ALT, n, exec, bash ~/.config/hypr/land/scripts/resize.sh l
binde = ALT, o, exec, bash ~/.config/hypr/land/scripts/resize.sh r
binde = ALT, i, exec, bash ~/.config/hypr/land/scripts/resize.sh u
binde = ALT, e, exec, bash ~/.config/hypr/land/scripts/resize.sh d

# Actions on active window
bind = , F11, fullscreen, 0
bind = $mainMod, F11, fullscreen, 1
bind = $mainMod, V, exec, bash ~/.config/hypr/land/scripts/togglefloat.sh
bind = $mainMod, J, layoutmsg, togglesplit

# Move/resize window with mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = ALT, mouse:272, resizewindow

# Lock screen on lid close
bindl=,switch:Lid Switch, exec, bash ~/.config/wlogout/logout.sh
